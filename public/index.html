<main>
  <section id="lobby">
    <h1><span>Gincana Digital</span></h1>
    <p class="muted">Provas de teclado e mouse para a turma. Entre numa sala, escolham a prova e cliquem em "pronto". Quando o tempo de <span id="duration">2 minutos</span> acabar, vence quem fez mais pontos.</p>

    <label for="name">Seu nome</label>
    <input id="name" maxlength="20" autocomplete="off" placeholder="Ex.: Maria do 8º B" autofocus>

    <h2>Escolha sua sala</h2>
    <div class="rooms" id="rooms"></div>
    <p id="lobbyMsg" role="alert"></p>
  </section>

  <section id="game" class="hidden">
    <div class="topbar">
      <span class="tag" id="roomName"></span>
      <span id="round" class="muted"></span>
      <button class="ghost" id="musicBtn" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-music-notes"/></svg> Música</button>
      <button class="ghost" id="sfxBtn" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-speaker-high"/></svg> Efeitos</button>
      <button class="ghost" id="leaveBtn"><svg class="icon" aria-hidden="true"><use href="#i-door-open"/></svg> Trocar de sala</button>
    </div>

    <div class="modes" id="modes" role="group" aria-label="Prova">
      <button class="mode" data-mode="digitacao" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg> Corrida das Letras</button>
      <button class="mode" data-mode="caca" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-cursor-click"/></svg> Caça às Letras</button>
    </div>
    <p class="muted" id="modeHelp"></p>

    <div class="clock" id="clock" role="timer"><svg class="icon" aria-hidden="true"><use href="#i-timer"/></svg><span id="clockTime"></span></div>
    <div class="word" id="word" aria-live="polite"></div>
    <p id="info" aria-live="polite"></p>
    <input id="guess" maxlength="30" placeholder="Digite a palavra aqui" aria-label="Digite a palavra" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
    <button class="ghost hidden" id="skipBtn">Pular palavra (−1 ponto) · Esc</button>
    <div class="arena hidden" id="arena" aria-label="Área da Caça às Letras"></div>
    <div class="controls">
      <button class="primary" id="readyBtn" aria-pressed="false">Estou pronto!</button>
      <span class="muted" id="readyHint"></span>
    </div>

    <h2>Placar</h2>
    <ol class="track" id="scores"></ol>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
