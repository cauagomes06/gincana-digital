<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrida das Letras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFBF6; --line: #C9DBEF; --margin: #E8505B; --ink: #1D2B53; --muted: #5B6785;
    --marker: #FFE14D; --good: #179C5B; --bad: #E8505B;
    --azul: #2D6CDF; --verde: #179C5B; --roxa: #7B4FD6;
    --room: var(--ink); --margin-x: 64px; --rule: 32px;
  }
  body[data-room="azul"] { --room: var(--azul); }
  body[data-room="verde"] { --room: var(--verde); }
  body[data-room="roxa"] { --room: var(--roxa); }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: 20px/var(--rule) 'Atkinson Hyperlegible', system-ui, sans-serif;
    background-color: var(--paper);
    /* notebook paper: red margin line over blue ruled lines */
    background-image:
      linear-gradient(to right, transparent calc(var(--margin-x) - 2px), var(--margin) calc(var(--margin-x) - 2px), var(--margin) var(--margin-x), transparent var(--margin-x)),
      repeating-linear-gradient(to bottom, transparent 0 calc(var(--rule) - 1px), var(--line) calc(var(--rule) - 1px) var(--rule));
  }
  main { max-width: 760px; margin: 0 auto; padding: var(--rule) 24px calc(var(--rule) * 2); text-align: center; }
  @media (max-width: 920px) { main { padding-left: calc(var(--margin-x) + 16px); } }
  h1, h2, .word { font-family: 'Lilita One', system-ui, sans-serif; font-weight: 400; }
  h1 { font-size: clamp(2.6rem, 8vw, 4.2rem); line-height: 1; margin: 0 0 8px; }
  h1 span { display: inline-block; transform: rotate(-2deg); background: linear-gradient(transparent 55%, var(--marker) 55% 90%, transparent 90%); }
  h2 { font-size: 1.6rem; line-height: var(--rule); margin: var(--rule) 0 0; }
  p { margin: 0 auto var(--rule); max-width: 60ch; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  label { display: block; font-weight: 700; }
  input {
    display: block; margin: 0 auto; text-align: center;
    font: inherit; font-size: 1.4rem; color: var(--ink); width: 100%; max-width: 420px;
    padding: 10px 14px; border: 3px solid var(--ink); border-radius: 10px; background: #fff;
  }
  input:disabled { background: #EEF1F6; border-color: #B8C1D6; }
  button { font: inherit; font-weight: 700; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--marker); outline-offset: 3px; box-shadow: 0 0 0 6px var(--ink); }

  .primary {
    background: var(--room); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px;
    box-shadow: 0 4px 0 var(--ink); transition: transform .08s;
  }
  .primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .primary:disabled { opacity: .45; cursor: default; }
  .primary[aria-pressed="true"] { background: #fff; color: var(--room); outline: 3px solid var(--room); }
  .lane .ok { color: var(--good); font-weight: 700; }
  .ghost { background: none; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 14px; font-size: .9rem; line-height: 1.4; }
  .ghost[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }

  /* lobby: rooms look like notebook covers */
  .rooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-top: 12px; text-align: left; }
  .room {
    text-align: left; color: #fff; border: 0; border-radius: 6px 14px 14px 6px; padding: 18px 18px 18px 30px;
    background: var(--c); position: relative; box-shadow: 0 5px 0 var(--ink); transition: transform .1s;
  }
  .room::before { /* spiral binding */
    content: ''; position: absolute; left: 8px; top: 12px; bottom: 12px; width: 8px;
    background: radial-gradient(circle, var(--paper) 3px, transparent 4px) 0 0 / 8px 16px;
  }
  .room:hover:not(:disabled) { transform: translateY(-3px) rotate(-1deg); }
  .room:disabled { filter: grayscale(.7); opacity: .6; cursor: not-allowed; }
  .room strong { display: block; font: 1.7rem/1.1 'Lilita One', system-ui, sans-serif; }
  .room small { display: block; font-size: 1rem; opacity: .95; }
  #lobbyMsg { color: var(--bad); font-weight: 700; min-height: var(--rule); margin: 8px 0 0; }

  /* game */
  .topbar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; margin-bottom: var(--rule); }
  .tag { background: var(--room); color: #fff; border-radius: 999px; padding: 2px 14px; font-weight: 700; }
  .word {
    font-size: clamp(2.6rem, 11vw, 5.5rem); line-height: 1.1; margin: 8px 0; min-height: 1.1em;
    overflow-wrap: anywhere; letter-spacing: .02em;
  }
  .word .done { color: var(--room); background: linear-gradient(transparent 60%, var(--marker) 60% 92%, transparent 92%); }
  .word .wrong { color: var(--bad); }
  #info { font-weight: 700; min-height: var(--rule); margin: 0 0 8px; }
  #guess.shake { animation: shake .25s; border-color: var(--bad); }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .controls { display: flex; flex-direction: column; gap: 4px; align-items: center; margin-top: 16px; }
  .clock { font: clamp(2rem, 7vw, 3rem)/1.2 'Lilita One', system-ui, sans-serif; color: var(--room); min-height: 1.2em; font-variant-numeric: tabular-nums; }
  .clock.hurry { color: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); } }

  /* race track scoreboard */
  /* lanes stay in the DOM and are re-sorted with `order`, so cars glide instead of jumping */
  .track { list-style: none; padding: 0; margin: 12px auto 0; max-width: 620px; text-align: left; display: flex; flex-direction: column; }
  .lane.offline { opacity: .5; }
  .lane.offline .label::after { content: ' (caiu)'; }
  .lane { display: grid; grid-template-columns: minmax(80px, 160px) 1fr 3ch; gap: 10px; align-items: center; line-height: var(--rule); }
  .lane .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane.me .name { font-weight: 700; color: var(--room); }
  .road { position: relative; height: 20px; border-bottom: 2px dashed var(--muted); margin-right: 22px; }
  .road::after { content: '🏁'; position: absolute; right: -24px; top: -4px; font-size: 18px; line-height: 1; }
  .car {
    position: absolute; top: 0; left: calc((100% - 24px) * var(--f));
    width: 24px; height: 24px; border-radius: 50%; background: var(--room); color: #fff;
    font: 13px/24px 'Lilita One', system-ui, sans-serif; text-align: center; transition: left .5s cubic-bezier(.3, 1.6, .5, 1);
  }
  .lane:not(.me) .car { background: var(--muted); }
  .lane .score { font-weight: 700; text-align: right; }

  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 8px; font: 700 1rem/1.3 'Atkinson Hyperlegible', system-ui, sans-serif; letter-spacing: 0; }
  .podium div { width: 120px; padding: 6px; border-radius: 8px 8px 0 0; background: var(--room); color: #fff; overflow-wrap: anywhere; }
  .podium b { display: block; font: 1.8rem/1.1 'Lilita One', system-ui, sans-serif; }
  .podium .p1 { min-height: 130px; background: var(--marker); color: var(--ink); }
  .podium .p2 { min-height: 100px; }
  .podium .p3 { min-height: 80px; }
  #skipBtn { margin: 10px auto 0; }

  @media (max-width: 560px) {
    :root { --margin-x: 28px; }
    main { padding-left: calc(var(--margin-x) + 14px); padding-right: 16px; }
    .lane { grid-template-columns: 80px 1fr 3ch; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <section id="lobby">
    <h1><span>Corrida das Letras</span></h1>
    <p class="muted">Todos recebem as mesmas palavras e cada um digita no seu ritmo. Cada palavra certa vale 1 ponto. Quando o tempo de <span id="duration">2 minutos</span> acabar, vence quem fez mais pontos.</p>

    <label for="name">Seu nome</label>
    <input id="name" maxlength="20" autocomplete="off" placeholder="Ex.: Maria do 8º B" autofocus>

    <h2>Escolha sua sala</h2>
    <div class="rooms" id="rooms"></div>
    <p id="lobbyMsg" role="alert"></p>
  </section>

  <section id="game" class="hidden">
    <div class="topbar">
      <span class="tag" id="roomName"></span>
      <span id="round" class="muted"></span>
      <button class="ghost" id="musicBtn" aria-pressed="true">♪ Música</button>
      <button class="ghost" id="sfxBtn" aria-pressed="true">🔊 Efeitos</button>
      <button class="ghost" id="leaveBtn">Trocar de sala</button>
    </div>

    <div class="clock" id="clock" role="timer"></div>
    <div class="word" id="word" aria-live="polite"></div>
    <p id="info" aria-live="polite"></p>
    <input id="guess" maxlength="30" placeholder="Digite a palavra aqui" aria-label="Digite a palavra" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
    <button class="ghost hidden" id="skipBtn">Pular palavra (−1 ponto) · Esc</button>
    <div class="controls">
      <button class="primary" id="readyBtn" aria-pressed="false">Estou pronto!</button>
      <span class="muted" id="readyHint"></span>
    </div>

    <h2>Placar</h2>
    <ol class="track" id="scores"></ol>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const ROOM_COLORS = { azul: 'var(--azul)', verde: 'var(--verde)', roxa: 'var(--roxa)' };
  let ws, myKey, word = '', lastGood = true, clockTimer, myReady = false, replaced = false;
  const lanes = new Map(); // player key -> <li>
  // secret id survives reloads in this tab, so a dropped student rejoins the same match with their score
  const session = (() => { try { return JSON.parse(sessionStorage.getItem('corrida')) || {}; } catch { return {}; } })();
  session.id = session.id || Math.random().toString(36).slice(2) + Date.now().toString(36);
  const saveSession = () => { try { sessionStorage.setItem('corrida', JSON.stringify(session)); } catch {} };
  saveSession();
  function setReady(ready) {
    myReady = ready;
    $('readyBtn').setAttribute('aria-pressed', ready);
    $('readyBtn').textContent = ready ? '✓ Pronto! (clique para cancelar)' : 'Estou pronto!';
  }
  function stopClock() {
    clearInterval(clockTimer);
    $('clock').classList.remove('hurry');
  }
  const clockText = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  // "3, 2, 1" in the word area, then the match clock counting down
  function runClock(countdownMs, durationMs) {
    const startAt = Date.now() + countdownMs, endAt = startAt + durationMs;
    let lastBeep;
    stopClock();
    const update = () => {
      const now = Date.now();
      if (now < startAt) {
        const n = Math.ceil((startAt - now) / 1000);
        if (n !== lastBeep) { lastBeep = n; $('word').textContent = n; SFX.tick(); }
        $('clock').textContent = `⏱ ${clockText(Math.ceil(durationMs / 1000))}`;
        return;
      }
      const left = Math.max(0, Math.ceil((endAt - now) / 1000));
      $('clock').textContent = `⏱ ${clockText(left)}`;
      $('clock').classList.toggle('hurry', left <= 10);
      if (left <= 5 && left > 0 && left !== lastBeep) { lastBeep = left; SFX.tick(); }
      if (!left) stopClock();
    };
    update();
    clockTimer = setInterval(update, 100);
  }

  // ---------- audio: chiptune loop + effects, all synthesized (no audio files) ----------
  const prefs = { music: true, sfx: true };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem('corrida-sound')) || {}); } catch {}
  let ctx, musicBus, sfxBus, musicTimer, step = 0, nextAt = 0;
  const hz = (n) => 440 * 2 ** ((n - 69) / 12);

  function initAudio() {
    if (ctx) return ctx.resume();
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    musicBus = ctx.createGain(); musicBus.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.connect(ctx.destination);
    applySound();
    if (document.body.dataset.room) startMusic();
  }
  // browsers only allow sound after a click or key press (matters after an automatic rejoin)
  addEventListener('pointerdown', initAudio, { once: true });
  addEventListener('keydown', initAudio, { once: true });
  function tone(note, at, dur, type, bus, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = hz(note);
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + dur);
    o.connect(g).connect(bus);
    o.start(at); o.stop(at + dur + 0.05);
  }
  // C – Am – F – G, arpeggiated lead over a walking bass
  const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
  const ARP = [0, 1, 2, 1, 0, 2, 1, 2];
  const STEP = 0.19;
  function scheduleMusic() {
    while (nextAt < ctx.currentTime + 0.12) {
      const chord = CHORDS[Math.floor(step / 8) % 4], i = step % 8;
      tone(chord[ARP[i]] + 12, nextAt, 0.16, 'square', musicBus, 0.25);
      if (i % 2 === 0) tone(chord[0] - 12 + (i === 4 ? 7 : 0), nextAt, 0.32, 'triangle', musicBus, 0.7);
      step = (step + 1) % 32;
      nextAt += STEP;
    }
  }
  function startMusic() {
    if (!ctx || musicTimer) return;
    nextAt = ctx.currentTime + 0.05;
    musicTimer = setInterval(scheduleMusic, 30);
  }
  function stopMusic() { clearInterval(musicTimer); musicTimer = null; }
  function applySound() {
    if (ctx) { musicBus.gain.value = prefs.music ? 0.08 : 0; sfxBus.gain.value = prefs.sfx ? 0.25 : 0; }
    $('musicBtn').setAttribute('aria-pressed', prefs.music);
    $('sfxBtn').setAttribute('aria-pressed', prefs.sfx);
    try { localStorage.setItem('corrida-sound', JSON.stringify(prefs)); } catch {}
  }
  function sfx(notes, gap, dur, type = 'square', vol = 0.6) {
    if (!ctx) return;
    const t = ctx.currentTime;
    notes.forEach((n, i) => tone(n, t + i * gap, dur, type, sfxBus, vol));
  }
  const SFX = {
    key: () => sfx([84], 0, 0.04, 'square', 0.25),
    wrong: () => sfx([45, 41], 0.07, 0.12, 'sawtooth', 0.5),
    word: () => sfx([72, 79], 0.08, 0.12),
    correct: () => sfx([72, 79, 84], 0.06, 0.16, 'triangle', 0.8),
    tick: () => sfx([90], 0, 0.05, 'square', 0.3),
    join: () => sfx([60, 67, 72], 0.07, 0.14, 'triangle', 0.8),
    end: () => sfx([72, 72, 72, 76, 79, 76, 79, 84], 0.13, 0.22),
  };
  $('musicBtn').onclick = () => { prefs.music = !prefs.music; applySound(); };
  $('sfxBtn').onclick = () => { prefs.sfx = !prefs.sfx; applySound(); };

  // ---------- connection ----------
  function connect() {
    const sock = ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    sock.onmessage = (e) => { if (sock === ws) handle(JSON.parse(e.data)); }; // ignore a stale socket
    sock.onopen = () => {
      $('lobbyMsg').textContent = '';
      if (session.room) send({ type: 'join', name: session.name, room: session.room, id: session.id });
    };
    sock.onclose = () => {
      if (sock !== ws) return;
      $('guess').disabled = true;
      if (replaced) {
        stopClock();
        $('info').textContent = 'O jogo foi aberto em outra aba. Continue jogando por lá.';
        return;
      }
      $('lobbyMsg').textContent = 'Conexão perdida. Tentando reconectar…';
      $('info').textContent = 'Conexão perdida. Tentando reconectar… Seus pontos estão guardados.';
      setTimeout(connect, 2000);
    };
  }
  const send = (msg) => ws.readyState === 1 && ws.send(JSON.stringify(msg));

  function joinRoom(room) {
    const name = $('name').value.trim();
    if (!name) { $('lobbyMsg').textContent = 'Digite seu nome antes de escolher a sala.'; return $('name').focus(); }
    Object.assign(session, { name, room });
    saveSession();
    initAudio();
    send({ type: 'join', name, room, id: session.id });
  }
  function showLobby() {
    session.room = null;
    saveSession();
    stopMusic();
    stopClock();
    word = '';
    $('clock').textContent = '';
    lanes.clear();
    $('scores').replaceChildren();
    document.body.removeAttribute('data-room');
    $('game').classList.add('hidden');
    $('lobby').classList.remove('hidden');
  }
  $('leaveBtn').onclick = () => {
    send({ type: 'leave' });
    showLobby();
    $('lobbyMsg').textContent = '';
  };
  const skip = () => { if (word) send({ type: 'skip' }); };
  $('skipBtn').onclick = () => { skip(); $('guess').focus(); };
  $('readyBtn').onclick = () => {
    setReady(!myReady);
    send({ type: 'ready', ready: myReady });
    SFX.key();
  };

  // ---------- typing ----------
  function renderWord(typed = '') {
    const t = typed.toLowerCase().normalize('NFC');
    let ok = 0;
    while (ok < t.length && t[ok] === word[ok]) ok++;
    const done = document.createElement('span'); done.className = 'done'; done.textContent = word.slice(0, ok);
    const wrong = document.createElement('span'); wrong.className = 'wrong'; wrong.textContent = word.slice(ok, t.length);
    $('word').replaceChildren(done, wrong, word.slice(t.length));
    return ok === t.length;
  }
  $('guess').oninput = () => {
    const value = $('guess').value;
    const good = renderWord(value);
    if (good && value) SFX.key();
    if (!good && lastGood) { SFX.wrong(); $('guess').classList.remove('shake'); void $('guess').offsetWidth; $('guess').classList.add('shake'); }
    lastGood = good;
    if (value.trim().toLowerCase().normalize('NFC') === word) send({ type: 'guess', word: value });
  };
  // must not return false: an on* handler returning false cancels the keystroke
  $('guess').onkeydown = (e) => {
    if (e.key === 'Enter') send({ type: 'guess', word: $('guess').value });
    if (e.key === 'Escape') skip();
  };
  $('guess').onpaste = (e) => e.preventDefault(); // no copy-paste cheating

  // ---------- messages ----------
  function handle(msg) {
    if (msg.type === 'rooms') {
      const s = msg.duration / 1000;
      $('duration').textContent = s % 60 ? `${s} segundos` : s === 60 ? '1 minuto' : `${s / 60} minutos`;
      $('rooms').replaceChildren(...msg.rooms.map((r) => {
        const b = document.createElement('button');
        b.className = 'room';
        b.style.setProperty('--c', ROOM_COLORS[r.id]);
        b.disabled = r.count >= msg.max || r.running;
        const name = document.createElement('strong'); name.textContent = r.name;
        const count = document.createElement('small'); count.textContent = `${r.count} de ${msg.max} alunos`;
        const status = document.createElement('small');
        status.textContent = r.running ? '🔒 Partida em andamento' : r.count >= msg.max ? 'Sala cheia' : 'Esperando alunos';
        b.append(name, count, status);
        b.onclick = () => joinRoom(r.id);
        return b;
      }));
    } else if (msg.type === 'replaced') {
      replaced = true;
    } else if (msg.type === 'joined') {
      myKey = msg.key;
      // after a server restart keys start over: drop old lanes and the old match clock
      stopClock();
      lanes.clear();
      $('scores').replaceChildren();
      document.body.dataset.room = msg.room;
      $('roomName').textContent = msg.name;
      $('lobby').classList.add('hidden');
      $('game').classList.remove('hidden');
      word = '';
      $('word').textContent = '';
      $('clock').textContent = '';
      $('info').textContent = 'Clique em "Estou pronto!" quando estiver preparado.';
      $('skipBtn').classList.add('hidden');
      setReady(false);
      SFX.join();
      startMusic();
    } else if (msg.type === 'state') {
      const scale = Math.max(10, msg.players[0] ? msg.players[0].score : 0); // leader sets the scale
      const seen = new Set();
      msg.players.forEach((p, i) => {
        seen.add(p.key);
        let li = lanes.get(p.key);
        if (!li) {
          li = document.createElement('li');
          li.className = 'lane';
          li.innerHTML = '<span class="name"><span class="label"></span><span class="ok" aria-label="pronto"></span></span><span class="road"><span class="car"></span></span><span class="score"></span>';
          li.querySelector('.label').textContent = p.name;
          li.querySelector('.car').textContent = [...p.name][0].toUpperCase(); // spread keeps emoji whole
          lanes.set(p.key, li);
          $('scores').append(li);
        }
        li.style.order = i;
        li.classList.toggle('me', p.key === myKey);
        li.classList.toggle('offline', !p.online);
        li.querySelector('.ok').textContent = !msg.running && p.ready ? ' ✓' : '';
        li.querySelector('.car').style.setProperty('--f', Math.max(0, p.score) / scale);
        li.querySelector('.score').textContent = p.score;
      });
      for (const [key, li] of lanes) if (!seen.has(key)) { li.remove(); lanes.delete(key); }
      $('readyBtn').parentElement.classList.toggle('hidden', msg.running);
      const readyCount = msg.players.filter((p) => p.ready).length;
      $('readyHint').textContent = `${readyCount} de ${msg.players.length} prontos. A partida começa quando todos estiverem prontos.`;
      $('round').textContent = `${msg.players.length} ${msg.players.length === 1 ? 'aluno' : 'alunos'} na sala`;
    } else if (msg.type === 'start') {
      word = '';
      $('info').textContent = 'Prepare-se!';
      $('guess').value = '';
      $('guess').disabled = true;
      $('skipBtn').classList.add('hidden');
      runClock(msg.countdown, msg.duration);
    } else if (msg.type === 'word') {
      const first = !word;
      word = msg.word;
      lastGood = true;
      renderWord();
      $('info').textContent = msg.skipped ? 'Palavra pulada: −1 ponto.' : first ? 'Valendo! Digite rápido.' : 'Boa! Próxima palavra.';
      $('guess').value = '';
      $('guess').classList.remove('shake');
      $('guess').disabled = false;
      $('guess').focus();
      $('skipBtn').classList.remove('hidden');
      msg.skipped ? SFX.wrong() : first ? SFX.word() : SFX.correct();
    } else if (msg.type === 'end') {
      stopClock();
      $('clock').textContent = 'Tempo esgotado!';
      word = '';
      const placeOf = (p) => 1 + msg.ranking.filter((o) => o.score > p.score).length; // ties share a place
      const pts = (n) => `${n} ${Math.abs(n) === 1 ? 'ponto' : 'pontos'}`;
      const podium = document.createElement('div');
      podium.className = 'podium';
      for (const i of [1, 0, 2]) { // 2nd, 1st, 3rd
        const p = msg.ranking[i];
        if (!p) continue;
        const step = document.createElement('div');
        step.className = `p${i + 1}`;
        const place = document.createElement('b'); place.textContent = `${placeOf(p)}º`;
        step.append(place, p.name, document.createElement('br'), pts(p.score));
        podium.append(step);
      }
      $('word').replaceChildren(podium);
      const me = msg.ranking.find((p) => p.key === myKey);
      $('info').textContent = (me ? `Você ficou em ${placeOf(me)}º lugar com ${pts(me.score)}. ` : '') + 'Clique em "Estou pronto!" para jogar de novo.';
      $('guess').value = '';
      $('guess').disabled = true;
      $('skipBtn').classList.add('hidden');
      setReady(false);
      SFX.end();
    } else if (msg.type === 'error') {
      if (!$('game').classList.contains('hidden')) showLobby(); // automatic rejoin was refused
      $('lobbyMsg').textContent = msg.message;
    }
  }

  $('name').value = session.name || '';
  applySound();
  connect();
</script>
</body>
</html>
